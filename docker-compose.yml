# Local development. Start with hot reload:  docker compose up --build --watch
# Production uses docker-compose.prod.yml (ADR-0025).
#
# Dev stack on a server with HTTPS (Let's Encrypt for APP_DOMAIN via Caddy, ports 80/443):
#   docker compose --profile https up -d --build
# Set APP_DOMAIN and ALLOWED_DEV_ORIGINS=<APP_DOMAIN> in .env; DNS must point at the host.

x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://arlo:arlo@postgres:5432/arlo
  depends_on:
    postgres:
      condition: service_healthy
  init: true

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: arlo
      POSTGRES_PASSWORD: arlo
      POSTGRES_DB: arlo
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arlo -d arlo]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies DB migrations and creates pg-boss queues before web/worker start.
  migrate:
    <<: *app
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      target: dev
    command: [pnpm, migrate]

  web:
    <<: *app
    environment:
      DATABASE_URL: postgres://arlo:arlo@postgres:5432/arlo
      # Auth.js builds OAuth callback URLs from the request, which behind a proxy is localhost:3000.
      AUTH_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on: &after-migrate
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: dev
    ports:
      - 127.0.0.1:3000:3000
    develop:
      watch:
        - { action: sync, path: ., target: /app }
        - { action: rebuild, path: pnpm-lock.yaml }

  worker:
    <<: *app
    depends_on: *after-migrate
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
      target: dev
    ports:
      - 127.0.0.1:9090:9090
    develop:
      watch:
        - { action: sync, path: ., target: /app }
        - { action: rebuild, path: pnpm-lock.yaml }

  caddy:
    image: caddy:2.11-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      # Unset: localhost with a certificate from Caddy's internal CA.
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  # Issued TLS certificates; keep it to avoid Let's Encrypt rate limits.
  caddy_data:
  caddy_config:
